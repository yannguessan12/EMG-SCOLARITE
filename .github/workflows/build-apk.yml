name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Installer les dépendances
        run: npm install

      - name: Préparer le dossier web
        run: |
          WEBDIR=$(node -p "require('./capacitor.config.json').webDir || 'www'")
          if [ "$WEBDIR" != "." ]; then
            mkdir -p "$WEBDIR"
            cp index.html "$WEBDIR"/
          fi

      - name: Ajouter Android
        run: |
          if [ ! -d android ]; then npx cap add android; fi

      - name: Icônes et écran de démarrage
        continue-on-error: true
        run: |
          mkdir -p assets
          cp icon-only.png icon-foreground.png splash.png assets/
          npx @capacitor/assets generate --android --iconBackgroundColor '#ffffff' --splashBackgroundColor '#ffffff'

      - name: Synchroniser
        run: npx cap sync android

      - name: Compiler l'APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: EMG-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
